<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AgriVision AI{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="navbar-inner">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-icon">🌿</span>
        <span>AgriVision <strong>AI</strong></span>
      </a>
      <nav class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('detect_page') }}">Disease Detection</a>
        <a href="{{ url_for('about_page') }}">About</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>AgriVision AI — College Mini Project. Predictions are preliminary identifications only, not a substitute for professional agricultural diagnosis.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
